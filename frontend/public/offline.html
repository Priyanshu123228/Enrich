<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline | Enrich Ladies Beauty Parlor Sikar</title>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #FAF7F2;
        color: #1c1917;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 20px;
        box-sizing: border-box;
        text-align: center;
      }
      .card {
        background: #ffffff;
        border: 1px solid #e7e5e4;
        border-radius: 24px;
        padding: 40px 24px;
        max-width: 420px;
        width: 100%;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
      }
      .icon-box {
        width: 64px;
        height: 64px;
        margin: 0 auto 20px;
        background: #ffe4e6;
        color: #be123c;
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .icon-box svg {
        width: 32px;
        height: 32px;
        stroke: #be123c;
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      h1 {
        font-size: 22px;
        margin: 0 0 10px;
        color: #1c1917;
      }
      p {
        font-size: 14px;
        line-height: 1.6;
        color: #78716c;
        margin: 0 0 24px;
      }
      .btn {
        display: inline-block;
        background: #9f1239;
        color: #ffffff;
        text-decoration: none;
        padding: 12px 24px;
        border-radius: 12px;
        font-weight: 600;
        font-size: 14px;
        transition: background 0.2s ease;
      }
      .btn:hover {
        background: #881337;
      }
      .contact-strip {
        margin-top: 24px;
        padding-top: 20px;
        border-top: 1px solid #f5f5f4;
        font-size: 13px;
        color: #44403c;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon-box">
        <svg viewBox="0 0 24 24">
          <line x1="1" y1="1" x2="23" y2="23"></line>
          <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
          <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
          <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
          <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
          <line x1="12" y1="20" x2="12.01" y2="20"></line>
        </svg>
      </div>
      <h1>You are Currently Offline</h1>
      <p>
        Please check your internet connection. You can still reach our salon desk directly by telephone.
      </p>
      <a href="tel:+919667900313" class="btn">Call Desk: 96679 00313</a>
      <div class="contact-strip">
        <strong>Enrich Ladies Beauty Parlor</strong><br />
        First Floor, Sharda Heights, Chandpol, Sikar
      </div>
    </div>
  </body>
</html>
